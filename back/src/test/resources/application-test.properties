# Test Configuration
spring.application.name=aplazo-fullstack-challenge-test

# Test Database Configuration (will be set by @DynamicPropertySource)
# Database configuration is set dynamically by Testcontainers

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration for Tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Logging Configuration for Tests
logging.level.org.springframework=INFO
logging.level.com.aplazo=DEBUG
logging.level.org.testcontainers=INFO
logging.level.org.hibernate.SQL=DEBUG

# Disable security for easier testing
spring.security.oauth2.resourceserver.jwt.enabled=false

# Test-specific settings
spring.test.database.replace=none
